<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Option B — IG Classic</title>
<link rel="stylesheet" href="/vendor/local-fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#262A35;overflow:hidden}
.phone{width:390px;height:844px;margin:0 auto;position:relative;overflow:hidden;background:#fff}
/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;border-bottom:1px solid #EFEFF4}
.tb-user{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.tb-user .chev{color:#9AA0B0;font-size:12px;font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#262A35;font-size:17px}
/* header */
.head{display:flex;gap:22px;padding:18px 18px 14px;align-items:center}
.ava{width:86px;height:86px;border-radius:50%;background:#5B9BFA;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;
  box-shadow:0 0 0 2px #fff, 0 0 0 3.5px #DBDADF;flex:none}
.stats{flex:1;display:flex;justify-content:space-around}
.stat{text-align:center}
.stat b{display:block;font-size:17px;font-weight:700}
.stat span{font-size:13px;color:#262A35;font-weight:400}
/* meta */
.meta{padding:0 18px 14px}
.name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.chip{font-size:10px;font-weight:700;color:#6E59DD;background:#F1EEFF;padding:3px 8px;border-radius:99px;display:inline-flex;gap:4px;align-items:center}
.bio{font-size:13.5px;font-weight:400;margin-top:3px;line-height:1.45}
/* actions */
.actions{display:flex;gap:8px;padding:0 18px 14px}
.act{flex:1;height:36px;border:1px solid #DBDADF;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;color:#262A35;background:#FAFAFD}
.act .ic{font-size:13px;color:#6E7280}
/* tabs */
.tabs{display:flex;border-top:1px solid #EFEFF4}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;color:#B8BCC8;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;position:relative}
.tab .gi{font-size:15px}
.tab.active{color:#262A35}
.tab.active:after{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;background:#262A35}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-top:2px}
.tile{aspect-ratio:1;position:relative;overflow:hidden}
.tile .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;opacity:.85}
.t1{background:linear-gradient(135deg,#6358E3,#965DD9)} .t2{background:linear-gradient(135deg,#4AC2A8,#5B9BFA)}
.t3{background:linear-gradient(135deg,#F59BC0,#C33DFF)} .t4{background:linear-gradient(135deg,#DCAE54,#F59BC0)}
.t5{background:linear-gradient(135deg,#5B9BFA,#6358E3)} .t6{background:linear-gradient(135deg,#8CDDD1,#DCAE54)}
.t7{background:linear-gradient(135deg,#7C5CFF,#4AC2A8)} .t8{background:linear-gradient(135deg,#F7AECF,#5B9BFA)}
.t9{background:linear-gradient(135deg,#24274A,#6358E3)}
/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:62px;border-top:1px solid #EFEFF4;display:flex;align-items:center;justify-content:space-around;background:#fff;z-index:10}
.ni{font-size:20px;color:#262A35}
.ni.mut{color:#C6CAD4}
.plus{width:44px;height:44px;border-radius:14px;background:#262A35;color:#fff;display:grid;place-items:center;font-size:21px}
.caption{position:absolute;top:10px;right:12px;font-size:8.5px;font-weight:900;letter-spacing:1.5px;color:#C6CAD4;z-index:20}
</style></head>
<body>
<div class="phone">
  <div class="caption">PROFILE · OPTION B · IG CLASSIC</div>
  <div class="topbar">
    <div class="icon-btn">＋</div>
    <div class="tb-user">ari_test <span class="chev">⌄</span></div>
    <div class="icon-btn">☰</div>
  </div>

  <div class="head">
    <div class="ava">AT</div>
    <div class="stats">
      <div class="stat"><b>24</b><span>posts</span></div>
      <div class="stat"><b>312</b><span>followers</span></div>
      <div class="stat"><b>98</b><span>following</span></div>
    </div>
  </div>

  <div class="meta">
    <div class="name">Ari Test <span class="chip">✦ feeling creative</span></div>
    <div class="bio">living my best life<br>jaipur · est. 2026</div>
  </div>

  <div class="actions">
    <div class="act"><span class="ic">✎</span> Edit profile</div>
    <div class="act"><span class="ic">↗</span> Share profile</div>
    <div class="act"><span class="ic">＋</span> Discover</div>
  </div>

  <div class="tabs">
    <div class="tab active"><span class="gi">▦</span> Posts</div>
    <div class="tab"><span class="gi">✉</span> Card</div>
  </div>

  <div class="grid">
    <div class="tile t1"><div class="ov">✦</div></div>
    <div class="tile t2"><div class="ov">✧</div></div>
    <div class="tile t3"><div class="ov">✿</div></div>
    <div class="tile t4"><div class="ov">❋</div></div>
    <div class="tile t5"><div class="ov">✦</div></div>
    <div class="tile t6"><div class="ov">✧</div></div>
    <div class="tile t7"><div class="ov">✿</div></div>
    <div class="tile t8"><div class="ov">❋</div></div>
    <div class="tile t9"><div class="ov">✦</div></div>
  </div>

  <div class="nav">
    <div class="ni">⌂</div>
    <div class="ni mut">⌕</div>
    <div class="plus">＋</div>
    <div class="ni mut">➤</div>
    <div class="ni">◉</div>
  </div>
</div>
</body></html>
