# Cloudflare Pages config — API requests are proxied to the Render-hosted
# Supabase API via _worker.js Advanced Mode. nodejs_compat is retained for the
# worker runtime surface.
name = "priv-spaca"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Non-secret defaults only. Never put JWT_SECRET / GITHUB_PAT / CLOUDINARY_API_SECRET /
# passwords here — this file is committed to a PUBLIC repo. Set those as
# encrypted Pages secrets instead:
#   wrangler pages secret put JWT_SECRET --project-name priv-spaca
#   wrangler pages secret put GITHUB_PAT --project-name priv-spaca
#   wrangler pages secret put CLOUDINARY_CLOUD_NAME --project-name priv-spaca
#   wrangler pages secret put CLOUDINARY_API_KEY --project-name priv-spaca
#   wrangler pages secret put CLOUDINARY_API_SECRET --project-name priv-spaca
# (or via the Cloudflare dashboard: Pages project → Settings → Environment variables → Encrypt)
[vars]
GH_REPO = "ajitjaat1011-ui/PRIV-SPACA"
GH_BRANCH = "data"
# GitHub variables are used only for optional media-file fallback; database
# persistence is Supabase-only and no db.json path exists.
# Bug #11 fix: Admin users should be set as encrypted Pages secrets, not here
# in plaintext. Use: wrangler pages secret put ADMIN_USERS --project-name priv-spaca
# ADMIN_USERS = "" # Set via encrypted secret
# OWNER_EMAIL = "" # Set via encrypted secret
# OWNER_USERNAME = "" # Set via encrypted secret
