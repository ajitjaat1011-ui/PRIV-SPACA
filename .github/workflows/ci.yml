name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax (basic JS health)
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*"); do
            node --check "$f" 2>/dev/null || echo "WARN: $f failed node --check (may be ES module)"
          done
          echo "Basic validation complete"
      - name: Verify required files exist
        run: |
          for f in _headers _redirects index.html; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "⚠️  $f missing"; fi
          done
