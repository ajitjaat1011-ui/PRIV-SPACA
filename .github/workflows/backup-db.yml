name: Daily DB Backup

# Snapshots the live Turso database into the PRIVATE
# ajitjaat1011-ui/priv-spaca-backups repo (NOT this public repo).
#
# SECURITY: this workflow used to fetch a legacy db.json file from the
# "data" branch of THIS (public) repo and commit it under backups/ here.
# That legacy file contained real bcrypt password/PIN hashes and its
# presence in a public repo was a genuine data exposure, remediated by
# purging it from history. Turso has been the sole primary datastore for
# a long time, so that fetch permanently 404s now (expected).
#
# This replacement backs up Turso directly and writes ONLY into a
# separate PRIVATE repo, never into this public one. Do not change the
# destination repo to a public one, and do not remove the .gitignore
# guard in that repo.

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for the backup script only)
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/backup-and-wipe.js
            package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund @libsql/client

      - name: Snapshot Turso DB to JSON (backup-only, no wipe)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          mkdir -p /tmp/backup-out
          today=$(date -u +%F)
          node -e "
          const { createClient } = require('@libsql/client');
          const fs = require('fs');
          (async () => {
            const c = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
            const tables = ['ps_users','ps_posts','ps_messages','ps_notifications','ps_dm_index','ps_user_feeds','ps_events','ps_kv'];
            const dump = {};
            for (const t of tables) {
              try {
                const rs = await c.execute('SELECT * FROM ' + t);
                dump[t] = rs.rows.map(r => Object.fromEntries(Object.entries(r)));
              } catch (e) {
                dump[t] = { _error: String(e.message || e) };
              }
            }
            fs.writeFileSync('/tmp/backup-out/${today}.json', JSON.stringify(dump));
            console.log('Wrote backup, tables:', Object.keys(dump).join(', '));
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Push snapshot to PRIVATE backups repo
        env:
          BACKUP_PUSH_TOKEN: ${{ secrets.BACKUP_PUSH_TOKEN }}
        run: |
          today=$(date -u +%F)
          rm -rf /tmp/backups-repo
          git clone --depth 1 "https://${BACKUP_PUSH_TOKEN}@github.com/ajitjaat1011-ui/priv-spaca-backups.git" /tmp/backups-repo
          mkdir -p /tmp/backups-repo/backups
          cp "/tmp/backup-out/${today}.json" "/tmp/backups-repo/backups/${today}.json"
          cd /tmp/backups-repo
          find backups -name '*.json' -type f -mtime +30 -print -delete || true
          git config user.name  "priv-spaca-bot"
          git config user.email "bot@priv-spaca.app"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
          else
            git commit -m "Daily DB backup ${today}"
            git push
          fi
