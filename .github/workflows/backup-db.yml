name: Daily DB Backup

# Snapshots the live Supabase/Postgres database into the PRIVATE
# ajitjaat1011-ui/priv-spaca-backups repo (NOT this public repo).
#
# SECURITY: this workflow used to fetch a legacy db.json file from the
# "data" branch of THIS (public) repo and commit it under backups/ here.
# That legacy file contained real bcrypt password/PIN hashes and its
# presence in a public repo was a genuine data exposure, remediated by
# purging it from history. The pre-migration backup jobs were replaced by
# this pg_dump of the Supabase database at the storage cutover; the legacy
# snapshots remain archived in the private backups repo.
#
# Writes ONLY into a separate PRIVATE repo, never into this public one. Do
# not change the destination repo to a public one, and do not remove the
# .gitignore guard in that repo.

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Supabase database (custom-format pg_dump)
        env:
          # Session-pooler connection string. The node-pg "no-verify" sslmode
          # is not a libpq value, so the query string is dropped and
          # PGSSLMODE=require is used instead.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          base="${SUPABASE_DB_URL%%\?*}"
          export PGSSLMODE=require
          mkdir -p /tmp/backup-out
          today=$(date -u +%F)
          pg_dump "$base" --format=custom --file="/tmp/backup-out/${today}.dump"
          echo "dump written"

      - name: Push snapshot to PRIVATE backups repo
        env:
          BACKUP_PUSH_TOKEN: ${{ secrets.BACKUP_PUSH_TOKEN }}
        run: |
          today=$(date -u +%F)
          rm -rf /tmp/backups-repo
          git clone --depth 1 "https://${BACKUP_PUSH_TOKEN}@github.com/ajitjaat1011-ui/priv-spaca-backups.git" /tmp/backups-repo
          mkdir -p /tmp/backups-repo/backups
          cp "/tmp/backup-out/${today}.dump" "/tmp/backups-repo/backups/${today}.dump"
          cd /tmp/backups-repo
          find backups -name '*.dump' -type f -mtime +30 -print -delete || true
          git config user.name  "priv-spaca-bot"
          git config user.email "bot@priv-spaca.app"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
          else
            git commit -m "Daily DB backup ${today}"
            git push
          fi
