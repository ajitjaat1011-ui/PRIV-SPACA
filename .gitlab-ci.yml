# GitLab CI/CD pipeline for PRIV-SPACA.
#
# This mirror repo is an independent debug/test signal alongside the
# GitHub -> Cloudflare Pages production deploy. It runs against the real
# Hono API (api/cf-worker.js) booted locally by scripts/dev-server.mjs, with
# no secrets: without TURSO_* the API falls back to in-memory storage, which
# is exactly what we want for a smoke test.
#
# NOTE: the previous pipeline invoked python suites (rtc_parity_test.py,
# deep_practical_test.py, pw_inbox_test.py, pw_notes_test.py) and
# dev-server.js. None of those files exist in this repository any more, so
# every job was failing on a missing file. They are replaced below by checks
# that actually exist and actually protect production.

stages:
  - install
  - verify
  - smoke

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"

.node_defaults:
  image: node:20
  cache:
    key: "$CI_COMMIT_REF_SLUG-node"
    paths:
      - .npm-cache/
      - node_modules/

install_deps:
  extends: .node_defaults
  stage: install
  script:
    - npm install --no-audit --no-fund
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# Static guarantees: version sync (APP_VERSION === SW_VERSION), asset ?v=
# consistency, the API bundle resolving, route-table ordering and declared
# dependencies. Fails the pipeline on the mistakes that broke production before.
sanity_check:
  extends: .node_defaults
  stage: verify
  needs: ["install_deps"]
  script:
    - npm run check

# Boots the real worker and exercises the API end to end.
api_smoke:
  extends: .node_defaults
  stage: smoke
  needs: ["install_deps"]
  script:
    - node scripts/dev-server.mjs &
    - sleep 4
    - curl -sf http://localhost:8787/api/health || (echo "dev server failed to start" && exit 1)
    # Unauthenticated request must be rejected.
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/users)" = "401"
    # Unknown API path must hit the catch-all 404, not a route.
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/nope)" = "404"
    # Static assets and the SPA fallback must still be served.
    - test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/)" = "200"
    - echo "API smoke passed"
